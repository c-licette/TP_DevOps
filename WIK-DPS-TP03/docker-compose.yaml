services:
  api:
    build:
      context: ../WIK-DPS-TP02
      dockerfile: DockerFile2
    environment:
      - PING_LISTEN_PORT=4000
    expose:
      - "4000"
    deploy:
      replicas: 4
    networks:
      - tp-network

  reverse-proxy:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    networks:
      - tp-network

networks:
  tp-network:
    driver: bridge